name: CI

on:
  push:
  pull_request:

jobs:
  storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Production build (without live integrations)
        run: pnpm build
        env:
          AUTH_SECRET: ci-build-only-secret-not-for-deployment
          NEXT_PUBLIC_SITE_URL: https://cefalu.in
